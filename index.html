<style>
  :root{
    --bg:#0f1020;
    --panel:#181933;
    --accent:#6c5ce7;
    --accent2:#00d2ff;
    --text:#f2f2f7;
    --sub:#9a9ac0;
    --ground:#2c2d55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    overscroll-behavior:none;
  }
  .app-grid{
    max-width:1080px;margin:0 auto;padding:12px 12px 24px;
    min-height:100dvh;
    display:grid;
    grid-template-columns:150px minmax(280px,640px) 210px;
    grid-template-areas:"skins center rank";
    gap:12px;
    align-items:start;
    justify-content:center;
  }
  .center-col{
    grid-area:center;
    display:flex;flex-direction:column;align-items:center;
    min-width:0;
  }
  .panel{
    background:var(--panel);border-radius:14px;padding:14px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .panel h3{margin:0 0 10px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:0.3px;text-transform:uppercase;}

  .skin-panel{grid-area:skins;}
  .skin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .skin-swatch{
    aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
    transition:transform .12s;
  }
  .skin-swatch span{font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.6);font-weight:700;}
  .skin-swatch:active{transform:scale(0.94);}
  .skin-swatch.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.25);}

  .side-panel{grid-area:rank;display:flex;flex-direction:column;gap:16px;}
  .my-best{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .my-best strong{color:var(--text);font-size:16px;}
  .history-list,.rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .history-list li,.rank-list li{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    font-size:12px;background:rgba(255,255,255,0.03);border-radius:8px;padding:6px 8px;
  }
  .history-list li .hist-date{color:var(--sub);font-size:11px;}
  .rank-list li{justify-content:flex-start;}
  .rank-list .rank-no{
    width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;
  }
  .rank-list .rank-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-list .rank-score{font-variant-numeric:tabular-nums;color:var(--accent2);font-weight:700;}
  .rank-list li.me{background:rgba(108,92,231,0.18);border:1px solid rgba(108,92,231,0.4);}
  .history-list li.empty,.rank-list li.empty{color:var(--sub);justify-content:center;}
  .rank-register{display:flex;gap:6px;margin-bottom:8px;}
  .rank-register input{
    flex:1;min-width:0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;padding:7px 9px;color:var(--text);font-size:12px;
  }
  .rank-register input::placeholder{color:var(--sub);}
  .btn.small{padding:7px 12px;font-size:11px;margin-top:0;box-shadow:none;white-space:nowrap;}
  .rank-msg{font-size:11px;color:var(--sub);margin:0 0 8px;line-height:1.5;}

  @media (max-width:700px){
    .app-grid{
      grid-template-columns:1fr;
      grid-template-areas:"center" "skins" "rank";
      max-width:640px;
    }
    .skin-grid{grid-template-columns:repeat(4,1fr);}
    .side-panel{flex-direction:row;flex-wrap:wrap;}
    .side-panel > div{flex:1;min-width:220px;}
  }

  header{width:100%;text-align:center;padding:8px 0 4px;}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-0.5px;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{font-size:12px;color:var(--sub);margin:0;}

  .ad-slot{
    width:100%;max-width:728px;margin:10px auto;
    min-height:90px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.08);
    border-radius:8px;overflow:hidden;font-size:11px;color:var(--sub);
  }
  .ad-slot.bottom{min-height:100px;}
  .ad-label{position:absolute;font-size:9px;color:var(--sub);opacity:0.5;}

  .game-container{
    position:relative;width:100%;max-width:640px;
    border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#1b1c3a 0%,#12132a 60%,var(--ground) 100%);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    touch-action:manipulation;
    aspect-ratio: 16 / 9;
  }
  canvas{display:block;width:100%;height:100%;}

  .hud{
    position:absolute;top:10px;left:0;right:0;
    display:flex;justify-content:space-between;padding:0 14px;
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .hud .score{font-size:22px;font-weight:700;}
  .hud-right{display:flex;align-items:center;gap:8px;}
  .hud .best{font-size:13px;color:var(--sub);}
  .mute-btn{
    pointer-events:auto;
    width:28px;height:28px;border-radius:50%;border:none;
    background:rgba(255,255,255,0.1);color:var(--text);
    font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .mute-btn:active{transform:scale(0.92);}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;
    background:rgba(10,10,25,0.55);backdrop-filter:blur(2px);
    text-align:center;padding:20px;
  }
  .overlay h2{margin:0;font-size:24px;}
  .overlay p{margin:0;color:var(--sub);font-size:13px;line-height:1.6;}
  .overlay .final-score{font-size:40px;font-weight:800;margin:4px 0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .btn{
    margin-top:6px;padding:12px 28px;border:none;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f1020;font-weight:700;font-size:15px;cursor:pointer;
    box-shadow:0 6px 16px rgba(108,92,231,0.4);
  }
  .btn:active{transform:scale(0.97);}
  .btn.ghost{
    background:transparent;color:var(--text);
    box-shadow:none;border:1px solid rgba(255,255,255,0.18);
  }
  .over-btn-row{display:flex;gap:10px;margin-top:6px;}
  .over-btn-row .btn{margin-top:0;}
  .hidden{display:none !important;}

  .controls-hint{
    margin-top:10px;font-size:12px;color:var(--sub);text-align:center;
  }
  .controls-hint kbd{
    background:var(--panel);padding:2px 6px;border-radius:4px;font-size:11px;
  }

  footer{
    margin-top:20px;font-size:11px;color:var(--sub);text-align:center;line-height:1.8;
  }
  footer a{color:var(--sub);}

  @media (max-width:480px){
    h1{font-size:19px;}
    .hud .score{font-size:18px;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  try{
    (window.adsbygoogle = window.adsbygoogle || []).push({});
    (window.adsbygoogle = window.adsbygoogle || []).push({});
  }catch(e){}

  var MUTE_KEY = 'jumpit_muted';
  var audio = {
    ctx: null,
    master: null,
    bgmGain: null,
    sfxGain: null,
    muted: localStorage.getItem(MUTE_KEY) === '1',
    playing: false,
    timerId: null,
    nextNoteTime: 0,
    step: 0,
    tempo: 132,
    lead: [523.25, 659.25, 783.99, 659.25, 523.25, 659.25, 587.33, 493.88],
    bass: [130.81, null, 196.00, null, 130.81, null, 164.81, null]
  };
  var muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = audio.muted ? '🔇' : '🔊';

  function initAudio(){
    if(audio.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = audio.muted ? 0 : 1;
    audio.master.connect(audio.ctx.destination);

    audio.bgmGain = audio.ctx.createGain();
    audio.bgmGain.gain.value = 0.05;
    audio.bgmGain.connect(audio.master);

    audio.sfxGain = audio.ctx.createGain();
    audio.sfxGain.gain.value = 0.22;
    audio.sfxGain.connect(audio.master);
  }

  function toggleMute(){
    audio.muted = !audio.muted;
    localStorage.setItem(MUTE_KEY, audio.muted ? '1' : '0');
    muteBtn.textContent = audio.muted ? '🔇' : '🔊';
    if(audio.master) audio.master.gain.setTargetAtTime(audio.muted ? 0 : 1, audio.ctx.currentTime, 0.05);
    if(audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  }

  function playTone(time, freq, dur, type, dest, vol){
    var osc = audio.ctx.createOscillator();
    var g = audio.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(g);
    g.connect(dest);
    osc.start(time);
    osc.stop(time + dur + 0.02);
  }

  function bgmScheduleStep(time){
    var leadFreq = audio.lead[audio.step % audio.lead.length];
    playTone(time, leadFreq, 0.16, 'triangle', audio.bgmGain, 0.6);
    var bassFreq = audio.bass[audio.step % audio.bass.length];
    if(bassFreq) playTone(time, bassFreq, 0.28, 'sine', audio.bgmGain, 0.8);
    audio.step++;
  }

  function bgmScheduler(){
    if(!audio.playing) return;
    var scheduleAhead = 0.12;
    while(audio.nextNoteTime < audio.ctx.currentTime + scheduleAhead){
      bgmScheduleStep(audio.nextNoteTime);
      audio.nextNoteTime += (60 / audio.tempo) / 2;
    }
    audio.timerId = setTimeout(bgmScheduler, 25);
  }

  function startBgm(){
    if(!audio.ctx || audio.playing) return;
    if(audio.ctx.state === 'suspended') audio.ctx.resume();
    audio.playing = true;
    audio.step = 0;
    audio.nextNoteTime = audio.ctx.currentTime + 0.05;
    bgmScheduler();
  }

  function stopBgm(){
    audio.playing = false;
    if(audio.timerId){ clearTimeout(audio.timerId); audio.timerId = null; }
  }

  function playJumpSfx(){
    if(!audio.ctx) return;
    var t = audio.ctx.currentTime;
    var osc = audio.ctx.createOscillator();
    var g = audio.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(700, t + 0.1);
    g.gain.setValueAtTime(0.24, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    osc.connect(g);
    g.connect(audio.sfxGain);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  function playGameOverSfx(){
    if(!audio.ctx) return;
    var t = audio.ctx.currentTime;
    [392, 311.13, 261.63].forEach(function(freq, i){
      var start = t + i * 0.11;
      var osc = audio.ctx.createOscillator();
      var g = audio.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.18, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
      osc.connect(g);
      g.connect(audio.sfxGain);
      osc.start(start);
      osc.stop(start + 0.22);
    });
  }

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d', { alpha:false });
  var container = document.getElementById('gameContainer');
  var scoreEl = document.getElementById('scoreEl');
  var bestEl = document.getElementById('bestEl');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var finalScoreEl = document.getElementById('finalScoreEl');
  var newBestMsg = document.getElementById('newBestMsg');
  var startBtn = document.getElementById('startBtn');
  var retryBtn = document.getElementById('retryBtn');
  var shareBtn = document.getElementById('shareBtn');

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function resize(){
    var rect = container.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  var STORAGE_KEY = 'jumpit_best_score';
  var best = parseFloat(localStorage.getItem(STORAGE_KEY) || '0');
  bestEl.textContent = 'BEST ' + best.toFixed(2);

  var state = 'idle';
  var groundY, player, obstacles, particles;
  var speed, gravity, score, elapsed, spawnTimer, spawnInterval;
  var shakeT = 0;

  function initGame(){
    groundY = H * 0.82;
    player = {
      x: W * 0.16,
      y: groundY,
      w: Math.max(28, H*0.11),
      h: Math.max(28, H*0.11),
      vy: 0,
      onGround: true,
      jumpsLeft: 2,
      rot: 0
    };
    obstacles = [];
    particles = [];
    speed = W * 0.42;
    gravity = H * 3.3;
    score = 0;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 1.3;
    shakeT = 0;
  }

  function jump(){
    if(state === 'idle'){ startGame(); return; }
    if(state === 'over'){ return; }
    if(player.jumpsLeft > 0){
      player.vy = -H * 1.32;
      player.jumpsLeft--;
      spawnBurst(player.x + player.w/2, player.y + player.h, 6);
      playJumpSfx();
    }
  }

  function spawnBurst(x,y,n){
    for(var i=0;i<n;i++){
      particles.push({
        x:x, y:y,
        vx:(Math.random()-0.5)*140,
        vy:-Math.random()*160,
        life:0.4+Math.random()*0.3,
        t:0,
        r:2+Math.random()*2
      });
    }
  }

  function spawnObstacle(){
    var type = Math.random();
    var h, w, y;
    if(type < 0.55){
      h = H*(0.10+Math.random()*0.10);
      w = h*(0.5+Math.random()*0.4);
      y = groundY - h;
    } else if(type < 0.85){
      h = H*0.09;
      w = H*(0.22+Math.random()*0.15);
      y = groundY - h;
    } else {
      h = H*0.09;
      w = H*0.14;
      y = groundY - h - H*(0.22+Math.random()*0.10);
    }
    obstacles.push({x:W+10, y:y, w:w, h:h, passed:false});
  }

  function startGame(){
    initGame();
    state = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    lastT = performance.now();
    requestAnimationFrame(loop);
    initAudio();
    startBgm();
  }

  function endGame(){
    state = 'over';
    shakeT = 0.25;
    var isNew = score > best;
    if(isNew){
      best = score;
      localStorage.setItem(STORAGE_KEY, String(best));
    }
    bestEl.textContent = 'BEST ' + best.toFixed(2);
    finalScoreEl.textContent = score.toFixed(2);
    newBestMsg.classList.toggle('hidden', !isNew);
    overOverlay.classList.remove('hidden');
    stopBgm();
    playGameOverSfx();
    saveHistoryEntry(score);
    if(isNew && localStorage.getItem(NICK_KEY)) submitScore();
  }

  function onPointerDown(e){
    if(e.target && (e.target.id === 'startBtn' || e.target.id === 'retryBtn' || e.target.id === 'muteBtn' || e.target.id === 'shareBtn')) return;
    e.preventDefault();
    jump();
  }
  container.addEventListener('pointerdown', onPointerDown, {passive:false});
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    }
  });
  startBtn.addEventListener('click', startGame);
  document.getElementById('muteBtn').addEventListener('click', function(e){
    e.stopPropagation();
    toggleMute();
  });
  retryBtn.addEventListener('click', startGame);

  shareBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var text = '점프잇에서 ' + score.toFixed(2) + '점 기록했어요! 너도 도전해봐 🎮';
    var url = location.href.split('?')[0];
    if(navigator.share){
      navigator.share({ title: '점프잇 JUMP IT', text: text, url: url }).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text + ' ' + url).then(function(){
        var original = shareBtn.textContent;
        shareBtn.textContent = '복사됨!';
        setTimeout(function(){ shareBtn.textContent = original; }, 1400);
      }).catch(function(){});
    }
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && state === 'playing'){
      state = 'paused';
      stopBgm();
    } else if(!document.hidden && state === 'paused'){
      state = 'playing';
      lastT = performance.now();
      requestAnimationFrame(loop);
      startBgm();
    }
  });

  var lastT = 0;
  function loop(now){
    if(state !== 'playing'){ return; }
    var dt = Math.min((now - lastT)/1000, 0.033);
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    elapsed += dt;
    score += dt * 10 * (1 + speed/(W*0.42) - 1);
    scoreEl.textContent = Math.floor(score);

    speed = Math.min(W*0.42 + elapsed*W*0.012, W*0.95);
    spawnInterval = Math.max(0.75, 1.3 - elapsed*0.01);

    player.vy += gravity*dt;
    player.y += player.vy*dt;
    if(player.y > groundY){
      player.y = groundY;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = 2;
    } else {
      player.onGround = false;
    }
    player.rot = player.onGround ? 0 : Math.max(-0.5, Math.min(0.5, player.vy/(H*4)));

    spawnTimer += dt;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnObstacle();
    }

    var px = player.x, py = player.y - player.h, pw = player.w, ph = player.h;
    for(var i=obstacles.length-1;i>=0;i--){
      var o = obstacles[i];
      o.x -= speed*dt;
      if(o.x + o.w < -20){ obstacles.splice(i,1); continue; }
      var margin = pw*0.18;
      if(px+margin < o.x+o.w && px+pw-margin > o.x &&
         py+margin < o.y+o.h && py+ph-margin > o.y){
        endGame();
        return;
      }
    }

    for(var j=particles.length-1;j>=0;j--){
      var p = particles[j];
      p.t += dt;
      if(p.t > p.life){ particles.splice(j,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += gravity*0.5*dt;
    }

    if(shakeT>0) shakeT -= dt;
  }

  function draw(){
    ctx.save();
    if(shakeT>0){
      var s = shakeT*30;
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }

    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1b1c3a');
    grad.addColorStop(0.6,'#12132a');
    grad.addColorStop(1,'#2c2d55');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for(var s2=0; s2<18; s2++){
      var sx = (s2*97 - (elapsed*20)%W + W*3) % W;
      var sy = (s2*53) % (groundY*0.7);
      ctx.fillRect(sx, sy, 2, 2);
    }

    ctx.fillStyle = '#2c2d55';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 3;
    var dashLen = 24, gap = 18, off = (elapsed*speed) % (dashLen+gap);
    ctx.beginPath();
    for(var dx = -off; dx < W; dx += dashLen+gap){
      ctx.moveTo(dx, groundY + (H-groundY)*0.35);
      ctx.lineTo(dx+dashLen, groundY + (H-groundY)*0.35);
    }
    ctx.stroke();

    for(var i=0;i<obstacles.length;i++){
      var o = obstacles[i];
      var og = ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h);
      og.addColorStop(0,'#ff6b81');
      og.addColorStop(1,'#e84393');
      ctx.fillStyle = og;
      roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(6,o.w*0.2,o.h*0.2));
      ctx.fill();
    }

    ctx.save();
    var cx = player.x + player.w/2, cy = player.y - player.h/2;
    ctx.translate(cx,cy);
    ctx.rotate(player.rot);
    var curSkin = skins[selectedSkin];
    var pg = ctx.createLinearGradient(-player.w/2,-player.h/2,player.w/2,player.h/2);
    pg.addColorStop(0,curSkin.c1);
    pg.addColorStop(1,curSkin.c2);
    ctx.fillStyle = pg;
    roundRect(ctx, -player.w/2, -player.h/2, player.w, player.h, player.w*0.28);
    ctx.fill();
    ctx.fillStyle = '#0f1020';
    ctx.beginPath();
    ctx.arc(player.w*0.14, -player.h*0.12, Math.max(2,player.w*0.07), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    for(var j=0;j<particles.length;j++){
      var p = particles[j];
      var alpha = 1 - p.t/p.life;
      ctx.fillStyle = 'rgba(255,255,255,'+alpha.toFixed(2)+')';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  var SKIN_KEY = 'jumpit_skin';
  var skins = [
    {c1:'#00d2ff', c2:'#6c5ce7'},
    {c1:'#ff9f43', c2:'#ee5253'},
    {c1:'#26de81', c2:'#0fb9b1'},
    {c1:'#fd79a8', c2:'#a55eea'}
  ];
  var selectedSkin = parseInt(localStorage.getItem(SKIN_KEY) || '0', 10);
  if(isNaN(selectedSkin) || selectedSkin < 0 || selectedSkin >= skins.length) selectedSkin = 0;

  var skinButtons = document.querySelectorAll('.skin-swatch');
  function renderSkinSelection(){
    skinButtons.forEach(function(btn){
      var idx = parseInt(btn.getAttribute('data-skin'), 10);
      btn.classList.toggle('selected', idx === selectedSkin);
    });
  }
  skinButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      selectedSkin = parseInt(btn.getAttribute('data-skin'), 10);
      localStorage.setItem(SKIN_KEY, String(selectedSkin));
      renderSkinSelection();
      if(state !== 'playing') draw();
    });
  });
  renderSkinSelection();

  var HISTORY_KEY = 'jumpit_history';
  var myBestEl = document.getElementById('myBestEl');
  var historyListEl = document.getElementById('historyList');

  function loadHistory(){
    try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch(e){ return []; }
  }

  function saveHistoryEntry(s){
    var hist = loadHistory();
    hist.unshift({ score: s, ts: Date.now() });
    hist = hist.slice(0, 20);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistory();
  }

  function pad2(n){ return n < 10 ? '0'+n : ''+n; }

  function renderHistory(){
    myBestEl.innerHTML = '최고 <strong>' + best.toFixed(2) + '</strong>';
    var hist = loadHistory();
    historyListEl.innerHTML = '';
    if(hist.length === 0){
      historyListEl.innerHTML = '<li class="empty">아직 기록이 없어요</li>';
      return;
    }
    hist.slice(0, 5).forEach(function(h){
      var d = new Date(h.ts);
      var dateStr = (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      var li = document.createElement('li');
      var scoreSpan = document.createElement('span');
      scoreSpan.textContent = h.score.toFixed(2);
      var dateSpan = document.createElement('span');
      dateSpan.className = 'hist-date';
      dateSpan.textContent = dateStr;
      li.appendChild(scoreSpan);
      li.appendChild(dateSpan);
      historyListEl.appendChild(li);
    });
  }

  var SUPABASE_URL = "https://ivrgcohnltdgaufnyzdb.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cmdjb2hubHRkZ2F1Zm55emRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzQyMTMsImV4cCI6MjEwNDQ1MDIxM30.8ntxD9FlOmqX50GihdFqK2mHhqzwP9YaFE5MXhJTWSs";
  var supabaseReady = false;
  var sb = null;

    if(window.supabase && SUPABASE_URL.indexOf('YOUR_') === -1){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var DEVICE_KEY = 'jumpit_device_id';
  var deviceId = localStorage.getItem(DEVICE_KEY);
  if(!deviceId){
    deviceId = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(DEVICE_KEY, deviceId);
  }

  var NICK_KEY = 'jumpit_nickname';
  var nicknameInput = document.getElementById('nicknameInput');
  nicknameInput.value = localStorage.getItem(NICK_KEY) || '';

  var rankMsg = document.getElementById('rankMsg');
  var rankListEl = document.getElementById('rankList');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderRankFallback(){
    rankMsg.textContent = '실시간 랭킹은 Supabase 연동 후 모두에게 공개돼요. 지금은 이 기기의 내 최고 기록만 보여요.';
    rankListEl.innerHTML = '';
    var li = document.createElement('li');
    li.innerHTML = '<span class="rank-no">1</span><span class="rank-name">' +
      escapeHtml(nicknameInput.value || '나') + '</span><span class="rank-score">' + best.toFixed(2) + '</span>';
    rankListEl.appendChild(li);
  }

  function renderRankRows(rows){
    rankListEl.innerHTML = '';
    if(!rows || rows.length === 0){
      rankListEl.innerHTML = '<li class="empty">아직 등록된 기록이 없어요</li>';
      return;
    }
    rows.forEach(function(r, i){
      var li = document.createElement('li');
      if(r.id === deviceId) li.classList.add('me');
      li.innerHTML = '<span class="rank-no">' + (i+1) + '</span><span class="rank-name">' +
        escapeHtml(r.name) + '</span><span class="rank-score">' + Number(r.score).toFixed(2) + '</span>';
      rankListEl.appendChild(li);
    });
  }

  function fetchRanking(){
    if(!supabaseReady) return;
    sb.from('leaderboard').select('id,name,score').order('score', { ascending:false }).limit(10)
      .then(function(res){
        if(res.error){ rankMsg.textContent = '랭킹을 불러오지 못했어요.'; return; }
        renderRankRows(res.data);
      });
  }

  function submitScore(){
    var name = (nicknameInput.value || '익명').trim().slice(0, 8) || '익명';
    nicknameInput.value = name;
    localStorage.setItem(NICK_KEY, name);
    if(!supabaseReady){
      renderRankFallback();
      return;
    }
    rankMsg.textContent = '등록 중...';
    sb.from('leaderboard').upsert({ id: deviceId, name: name, score: best }, { onConflict: 'id' })
      .then(function(res){
        if(res.error){ rankMsg.textContent = '등록에 실패했어요. 잠시 후 다시 시도해주세요.'; }
        else{ rankMsg.textContent = '랭킹에 등록되었어요!'; }
      });
  }
  document.getElementById('registerBtn').addEventListener('click', submitScore);

  function listenRanking(){
    if(!supabaseReady){
      renderRankFallback();
      return;
    }
    fetchRanking();
    sb.channel('leaderboard-changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'leaderboard' }, fetchRanking)
      .subscribe();
  }

  renderHistory();
  listenRanking();

  initGame();
  draw();
})();
